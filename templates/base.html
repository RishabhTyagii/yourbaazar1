{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}YourBaazar - Online Shopping in India{% endblock %}</title>
<link rel="icon" type="image/png"  href="https://yourbaazar.com/static/icon/website_logo.png?v=3">
<meta name="google-site-verification" content="ea_mGzWeSklzZXQKE35AIzMAxkRbk_H9gxrkToDAeHU" />

    {% block seo %}
    <!-- Primary Meta Tags -->
    <meta name="title" content="YourBaazar - India's Best Online Shopping Site for Fashion, Electronics & More">
    <meta name="description" content="Shop online from YourBaazar. Explore the latest fashion, electronics, home essentials, and more at unbeatable prices. Fast delivery across India.">
    <meta name="keywords" content="online shopping India, buy online, YourBaazar, cheap online store, best deals India, fashion, electronics, home essentials">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourbaazar.com/">
    <meta property="og:title" content="YourBaazar - Online Shopping in India">
    <meta property="og:description" content="Discover trending products at YourBaazar. Lowest prices guaranteed with fast delivery and secure payment.">
    <meta property="og:image" content="https://yourbaazar.com/static/icon/website_logo.png?v=3">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://yourbaazar.com/">
    <meta name="twitter:title" content="YourBaazar - Online Shopping in India">
    <meta name="twitter:description" content="Discover trending products at YourBaazar. Lowest prices guaranteed with fast delivery and secure payment.">
    <meta name="twitter:image" content="https://yourbaazar.com/static/icon/website_logo.png?v=3">

    <!-- JSON-LD Structured Data (Organization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "YourBaazar",
      "url": "https://yourbaazar.com",
      "logo": "https://yourbaazar.com/static/icon/website_logo.png?v=3",
      "sameAs": [
        "https://www.facebook.com/Yourbaazar",
        "https://www.instagram.com/Yourbaazar",
        "https://twitter.com/Yourbaazar"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9758464721",
        "contactType": "Customer Service",
        "areaServed": "IN",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>
    {% endblock %}

    <!-- Favicon -->
    
    <!-- Manifest & PWA -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="apple-touch-icon" href="https://yourbaazar.com/static/icon/website_logo.png?v=3">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% include 'partials/nav.html' %}
    
    {% block content %}{% endblock %}

    <!-- AJAX Footer container -->
    <div id="footer-container">
        <p>Loading footer...</p>
    </div>

    <!-- Install App Button -->
    <button id="installBtn" style="display:none; position:fixed; bottom:10rem; right:5px; z-index:1000; padding:10px 16px; background:#98c0f8; color:white; border:none; border-radius:8px; font-weight:bold;">
        <i class="fa fa-download"></i> 
    </button>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('{% static "service-worker.js" %}')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>

    <!-- PWA Installation Handler -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
            console.log("PWA install prompt available");
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
                if (window.matchMedia('(display-mode: standalone)').matches) {
                    alert("App is already installed!");
                } else {
                    alert("Your browser doesn't support PWA installation or requirements aren't met");
                }
                return;
            }
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('User accepted install');
                installBtn.style.display = 'none';
            } else {
                console.log('User declined install');
            }
            
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA installed');
            installBtn.style.display = 'none';
        });

        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBtn.style.display = 'none';
        }
    </script>

    <!-- Load footer via AJAX -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('/ajax/footer/')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer-container').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading footer:', error);
                });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
