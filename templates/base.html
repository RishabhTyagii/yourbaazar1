    <!-- Favicon -->

    <link rel="manifest" href="https://www.yourbaazar.com/static/manifest.json">
    <link rel="apple-touch-icon" href="https://cdn.yourbaazar.com/static/icon/logo.png?v=3">

<body>

    {% include 'partials/nav.html' %}
    
    {% block content %}{% endblock %}

    <!-- AJAX Footer container -->
    <div id="footer-container">
        <p>Loading footer...</p>
    </div>

    <!-- Install App Button -->
    <!-- Install App Button -->
<button id="installBtn" style="display:none; position:fixed; bottom:10rem; right:5px; z-index:1000; padding:10px 16px; background:#98c0f8; color:white; border:none; border-radius:8px; font-weight:bold;">
    <i class="fa fa-download"></i>
</button>

<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js')
        .then(reg => console.log('ServiceWorker registered', reg))
        .catch(err => console.log('ServiceWorker registration failed:', err));
    });
}
</script>

<!-- PWA Installation Handler -->
<script>
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) {
        if (window.matchMedia('(display-mode: standalone)').matches) {
            alert("App already installed!");
        } else {
            alert("PWA installation not supported");
        }
        return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('User choice:', outcome);
    installBtn.style.display = 'none';
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    console.log('PWA installed');
    installBtn.style.display = 'none';
});

// Hide button if already standalone
if (window.matchMedia('(display-mode: standalone)').matches) {
    installBtn.style.display = 'none';
}
</script>

<!-- Link manifest for PWA -->

    <!-- Load footer via AJAX -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch('/ajax/footer/')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer-container').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading footer:', error);
                });
        });
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
