{% extends "seller/sellerbase.html" %}
{% load static %}
{% block content %}
  <title>Edit Profile</title>
  <style>
    /* Reset & base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }


    .containerr {
      background: #fff;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      max-width: 850px;
      width: 100%;
      box-shadow: 0px 8px 30px rgba(0,0,0,0.15);
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #4e54c8;
    }

    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    label {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      display: block;
    }

    input, select, textarea {
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      width: 100%;
      font-size: 1rem;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #4e54c8;
      outline: none;
      box-shadow: 0 0 6px rgba(78, 84, 200, 0.4);
    }

    button {
      padding: 0.9rem;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0px 6px 20px rgba(78, 84, 200, 0.3);
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="containerr">
    <h1>Edit Profile</h1>

    <form method="post">
      {% csrf_token %}
      <!-- Render Django form (better with crispy-forms or custom rendering) -->
      {{ form.as_p }}

      <button type="submit">Update Profile</button>
    </form>
  </div>

{% endblock %}
