<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Seller Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            z-index: 0;
        }
        
        body::after {
            content: "";
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            z-index: 0;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .container:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }
        
        .header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 35px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        

        .header::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .header::after {
            content: "";
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .header h2 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 15px;
            font-weight: 300;
            max-width: 300px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .form-container {
            padding: 35px;
            position: relative;
        }
        
        /* Style the form as_p output */
        form p {
            margin-bottom: 25px;
            position: relative;
        }
        
        form label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #2d3748;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        
        form input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8fafc;
            color: #2d3748;
            font-weight: 500;
        }
        
        form input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.2);
            background: #fff;
        }
        
        .input-icon {
            position: absolute;
            left: 18px;
            top: 43px;
            color: #a0aec0;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        form input:focus + .input-icon {
            color: #6a11cb;
        }
        
        .btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .back-link {
            text-align: center;
            margin-top: 25px;
        }
        
        .back-link a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
        }
        
        .back-link a:hover {
            color: #2575fc;
            background: rgba(106, 17, 203, 0.1);
            transform: translateX(-5px);
        }
        
        .back-link i {
            margin-right: 10px;
            transition: transform 0.3s;
        }
        
        .back-link a:hover i {
            transform: translateX(-3px);
        }
        
        .notification {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.5s ease;
        }
        
        .notification.success {
            background-color: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }
        
        .notification.error {
            background-color: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #e53e3e;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-size: 14px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                border-radius: 16px;
            }
            
            .form-container {
                padding: 25px;
            }
            
            .header {
                padding: 25px 20px;
            }
            
            .header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Reset Your Password</h2>
            <p>Enter your email to receive a one-time password</p>
        </div>
        
        <div class="form-container">
            <!-- Notification area for form messages -->

            <!-- Original form structure preserved exactly -->
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">
                    <i class="fas fa-paper-plane"></i> Send OTP
                </button>
            </form>
            
            <div class="back-link">
                <a href="{% url 'seller:seller_login' %}">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
            
            <div class="footer">
                <p>© 2023 Seller Portal. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script>
        // Add icon to the email input field
        document.addEventListener('DOMContentLoaded', function() {
            // Find the email input field
            const emailInput = document.querySelector('input[type="email"]');
            if (emailInput) {
                // Create and add the icon
                const icon = document.createElement('i');
                icon.className = 'fas fa-envelope input-icon';
                emailInput.parentNode.appendChild(icon);
                
                // Add focus effects
                emailInput.addEventListener('focus', function() {
                    this.style.paddingLeft = '50px';
                    icon.style.color = '#6a11cb';
                });
                
                emailInput.addEventListener('blur', function() {
                    icon.style.color = '#a0aec0';
                });
            }
            
            // Add animation to container on load
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });




        
    </script>
</body>
</html>
